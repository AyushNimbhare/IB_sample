<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Banking Simulation — FinTree Career Discovery Program</title>
<meta name="description" content="A three-stage sample of the Investment Banking simulation: welcome, briefing room, and Project Prism.">
<!-- Unlisted: shared by link only. See robots.txt. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Rethink+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/ib.css">
</head>
<body>
<div id="app"></div>

<noscript>
  <div class="empty" style="margin:64px auto;max-width:560px">
    This simulation needs JavaScript. Please enable it and reload.
  </div>
</noscript>

<script>
  /* ---------------------------------------------------------------------
     Content first, engine second. The engine reads window.IB_BRIEFING and
     window.IB_DEAL at load, so the order matters.

     Classic script tags rather than modules: this has to open from a
     file:// tab as well as over http, with no server and no build step.
     --------------------------------------------------------------------- */
  (function () {
    var SOURCES = ['data/briefing.js', 'data/deal-prism.js'];
    var loaded = 0;

    function fail(message) {
      var app = document.getElementById('app');
      app.innerHTML =
        '<div class="empty" style="margin:64px auto;max-width:560px">' +
          '<p>' + message + '</p>' +
        '</div>';
    }

    function next() {
      loaded++;
      if (loaded < SOURCES.length) return;
      if (!window.IB_BRIEFING || !window.IB_DEAL) {
        fail('The content files loaded but contain no data.');
        return;
      }
      var engine = document.createElement('script');
      engine.src = 'assets/ib.js';
      engine.onerror = function () { fail('The simulation engine failed to load.'); };
      document.body.appendChild(engine);
    }

    for (var i = 0; i < SOURCES.length; i++) {
      var s = document.createElement('script');
      s.src = SOURCES[i];
      s.onload = next;
      s.onerror = function () {
        fail('Could not load a content file. Check that data/briefing.js and ' +
             'data/deal-prism.js exist next to this page.');
      };
      document.body.appendChild(s);
    }
  })();
</script>
</body>
</html>
